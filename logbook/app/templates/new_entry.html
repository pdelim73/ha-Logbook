{% extends "base.html" %}
{% from "macros.html" import tags_widget %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-8">
<div class="card">
  <div class="card-header"><h4 class="mb-0">New Log Entry</h4></div>
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label fw-semibold">Username *</label>
          {% if ha_users %}
            <select name="username" class="form-select" required>
              <option value="">— Select user —</option>
              {% for user in ha_users %}
                <option value="{{ user }}"
                  {% if user == current_user %}selected{% endif %}>{{ user }}</option>
              {% endfor %}
              {# If the logged-in HA user isn't in the persons list, add them so they are always pre-selected #}
              {% if current_user and current_user not in ha_users %}
                <option value="{{ current_user }}" selected>{{ current_user }}</option>
              {% endif %}
            </select>
          {% else %}
            <input type="text" name="username" class="form-control" required
                   value="{{ current_user }}"
                   placeholder="Enter username (no HA persons found)">
            <div class="form-text text-warning">
              ⚠ No HA persons found. Add people in HA → Settings → People,
              or type a name manually.
            </div>
          {% endif %}
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Date and Time *</label>
          <input type="datetime-local" name="entry_datetime"
                 class="form-control" value="{{ now }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Location</label>
          <select name="location" class="form-select">
            <option value="">— None —</option>
            {% for l in locations %}
              <option value="{{ l.name }}">{{ l.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Area</label>
          <select name="area" class="form-select">
            <option value="">— None —</option>
            {% for a in areas %}
              <option value="{{ a.name }}">{{ a.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Category</label>
          <select name="category" class="form-select">
            <option value="">— None —</option>
            {% for c in categories %}
              <option value="{{ c.name }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Severity</label>
          <select name="severity" class="form-select">
            <option value="">— None —</option>
            {% for s in severities %}
              <option value="{{ s.name }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Description *</label>
          <textarea name="description" class="form-control" rows="5"
                    required placeholder="Describe the event in detail..."></textarea>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Tags</label>
          {{ tags_widget(tags) }}
        </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="recurrent" id="recurrent">
            <label class="form-check-label" for="recurrent">Recurrent event</label>
          </div>
        </div>

        <div class="col-12 d-grid gap-2 d-md-flex mt-2">
          <button type="submit" class="btn btn-primary py-2 py-md-1">Save Entry</button>
          <a href="{{ url_for('index') }}" class="btn btn-outline-secondary py-2 py-md-1">Cancel</a>
        </div>

      </div>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
